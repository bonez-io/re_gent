# Secure single-node self-hosted profile.
#
#   export REGENT_DOMAIN=regent.example.com
#   docker compose -f docker-compose.production.yml up -d --build
#   docker compose -f docker-compose.production.yml logs regent-server
#
# On first start (an empty regent-data volume) the server creates the `admin`
# user with a random initial password -- or with REGENT_ADMIN_PASSWORD, set in
# the environment or .env, when you want a known one -- and prints the
# sign-in line to its own stdout, which the `logs` command above shows. That
# password only works until the wizard's first screen replaces it, at
# https://$REGENT_DOMAIN/.
#
# Caddy obtains and renews public TLS certificates. The Go server is reachable
# only on the internal network and always runs the persistent self-hosted auth
# composition; there is no insecure override in this profile.
services:
  regent-server:
    build: .
    image: regent-server:production
    command: ["--addr", "0.0.0.0:7654", "--data", "/data", "--auth-mode", "self-hosted"]
    environment:
      # Optional: pin the admin user's initial password instead of letting
      # the server generate a random one. Only takes effect on an empty
      # regent-data volume; a running instance ignores a changed value.
      REGENT_ADMIN_PASSWORD: ${REGENT_ADMIN_PASSWORD:-}
      REGENT_PUBLIC_URL: "https://${REGENT_DOMAIN}"
    volumes:
      - regent-data:/data
    networks: [regent-internal]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]

  regent-web:
    build: ./web
    image: regent-web:production
    depends_on:
      regent-server:
        condition: service_healthy
    networks: [regent-internal]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2.10.2-alpine
    depends_on:
      regent-web:
        condition: service_healthy
    environment:
      REGENT_DOMAIN: "${REGENT_DOMAIN:?Set REGENT_DOMAIN to the public DNS name}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [regent-public, regent-internal]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

networks:
  regent-public:
  regent-internal:
    internal: true

volumes:
  regent-data:
  caddy-data:
  caddy-config:
