server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 70m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /healthz {
    proxy_pass http://regent-server:7654;
    proxy_set_header Host $http_host;
  }

  location = /repos {
    proxy_pass http://regent-server:7654;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_request_buffering off;
  }

  # The skills catalog is server-global rather than repository-scoped. Keep
  # this ahead of the SPA fallback or production quietly returns index.html
  # and the UI mistakes the registry for an offline server.
  location ~ "^/api/(?:skills|v1)(?:/|$)" {
    proxy_pass http://regent-server:7654;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location ~ "^/[a-z0-9][a-z0-9._-]{0,63}/(?:api|objects|refs)(?:/|$)" {
    proxy_pass http://regent-server:7654;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_request_buffering off;
  }

  location ~ "^/(?:install(?:\.sh)?|bin/rgt)$" {
    proxy_pass http://regent-server:7654;
    proxy_set_header Host $http_host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
