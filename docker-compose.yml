# One-command re_gent server + UI (Docker). Optional: `make serve` / `make dev`
# run the same server natively and do not need Docker at all.
#
#   docker compose up -d --build
#   # or: make server
#
# Local development only, but the server runs the same persistent self-hosted
# auth composition as production; Docker Compose publishes both ports to host
# loopback only. On first start (an empty regent-data volume) the server
# creates the `admin` user with a random initial password -- or with
# REGENT_ADMIN_PASSWORD, set in .env, when you want a known one -- and prints
# the sign-in line to its own stdout, so both of these show it:
#
#   docker compose up -d          # foreground output on the first run
#   docker compose logs server    # any time after
#
# That password only works until the wizard's first screen replaces it, at
# https://<server address>/. For the legacy fully-open (no application auth)
# loopback mode instead, layer the optional override file:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  server:
    build: .
    image: regent-server:latest
    networks:
      default:
        aliases: [regent-server]
    command: ["--addr", "0.0.0.0:7654", "--data", "/data", "--auth-mode", "self-hosted"]
    environment:
      # Printed in the first-start ready message; the origin people open.
      REGENT_PUBLIC_URL: "http://127.0.0.1:${REGENT_WEB_PORT:-8080}"
      # Optional: pin the admin user's initial password instead of letting
      # the server generate a random one. Only takes effect on an empty
      # regent-data volume; a running instance ignores a changed value.
      REGENT_ADMIN_PASSWORD: ${REGENT_ADMIN_PASSWORD:-}
    ports:
      # Host port is overridable (REGENT_PORT) to avoid colliding with a
      # locally-running `rgt serve`; container always listens on 7654.
      - "127.0.0.1:${REGENT_PORT:-7654}:7654"
    volumes:
      - regent-data:/data
    restart: unless-stopped

  web:
    build: ./web
    image: regent-web:latest
    depends_on:
      server:
        condition: service_healthy
    ports:
      # regent-web talks to the "server" container over the compose network by
      # the network alias regent-server (see web/nginx.conf); only this published port is
      # reachable from the host, and only on loopback.
      - "127.0.0.1:${REGENT_WEB_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  # Named volume so served repos survive `docker compose down` / restarts.
  regent-data:
