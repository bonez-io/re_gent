# One-command re_gent server.
#
#   docker compose up -d --build
#   # or: make server
#
# Local development only. The server uses the explicit insecure override inside
# the container, while Docker publishes it to host loopback only.
services:
  server:
    build: .
    image: regent-server:latest
    container_name: regent-server
    command: ["--addr", "0.0.0.0:7654", "--data", "/data", "--insecure-no-auth"]
    ports:
      # Host port is overridable (REGENT_PORT) to avoid colliding with a
      # locally-running `rgt serve`; container always listens on 7654.
      - "127.0.0.1:${REGENT_PORT:-7654}:7654"
    volumes:
      - regent-data:/data
    restart: unless-stopped

volumes:
  # Named volume so served repos survive `docker compose down` / restarts.
  regent-data:
